// 注意：本项目**不使用 Mixin**（无 mixins.json、无 Access Transformer），
// 故不声明 org.spongepowered:mixingradle 插件解析策略（0.0.4 清理的历史残留）。
pluginManagement {
    repositories {
        gradlePluginPortal()
        maven {
            name = 'MinecraftForge'
            url = 'https://maven.minecraftforge.net/'
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.5.0'
}
