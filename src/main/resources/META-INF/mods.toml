modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/QieFanQie/"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
logoFile="GoetyTuner.png"
authors="${mod_authors}"
credits="音乐由[乌鸦Producer]提供"
displayURL="https://github.com/QieFanQie/"
description="Goety addon boss: The Tuner. A headless conductor who plays every Focus like an instrument."

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="goety"
    mandatory=true
    versionRange="[2.5,)"
    ordering="AFTER"
    side="BOTH"

# curios 仅作软依赖：本模组代码不直接引用 Curios API（Goety 本体已把它声明为必装依赖，
# 调律师使用法杖/聚晶的能力全部来自 Goety 的 IFocus/IWand 体系）。
[[dependencies.${mod_id}]]
    modId="curios"
    mandatory=false
    versionRange="[1.20-5.3.4,)"
    ordering="NONE"
    side="BOTH"

# patchouli 同样仅作软依赖：本模组不使用 Patchouli（Goety 的手册需要它）。
# build.gradle 中声明 implementation 是为了 dev 运行环境 classpath 完整。
[[dependencies.${mod_id}]]
    modId="patchouli"
    mandatory=false
    versionRange="[1.20-1.20.1,)"
    ordering="NONE"
    side="BOTH"
